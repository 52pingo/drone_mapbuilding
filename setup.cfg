[flake8]
max-line-length = 100

# E203 是切片冒号前的空格（x[a : b]）。black 就是这么格式化的，
# 保留它会和格式化工具互相打架，官方也建议忽略。
extend-ignore = E203

# 两类结构性的 E402，都不是疏漏：
#   tests/          必须先 sys.path.insert 才能导入被测模块
#   绘图脚本         必须先 matplotlib.use("Agg") 才能 import pyplot
per-file-ignores =
    tests/*.py:E402
    scripts/*.py:E402

exclude =
    .git,
    .venv-gui,
    build,
    dist,
    __pycache__,
    .pytest_cache
